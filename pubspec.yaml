name: lingoboop
description: "LingoBoom - AI-powered floating language learning companion."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.4
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/characters/maru/previews/maru.png
    - assets/characters/mimi/previews/mimi.png
    - assets/characters/bun/previews/bun.png
    - assets/characters/pano/previews/pano.png
    - assets/characters/pip/previews/pip.png
    - assets/characters/leo/previews/leo.png

name: lingoboop
description: "LingoBoom - AI-powered floating language learning companion."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.4
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  webview_flutter: ^4.14.1
  record: ^7.1.2
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  path_provider: ^2.1.5
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "app_icon.png"
  windows:
    generate: true
    image_path: "app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/web/
    - assets/characters/maru/previews/maru.png
    - assets/characters/mimi/previews/mimi.png
    - assets/characters/bun/previews/bun.png
    - assets/characters/pano/previews/pano.png
    - assets/characters/pip/previews/pip.png
    - assets/characters/leo/previews/leo.png

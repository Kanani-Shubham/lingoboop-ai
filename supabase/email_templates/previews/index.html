<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoBoop AI — Email Design System Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1E5E4E;
      --primary-light: #2C6E5E;
      --primary-subtle: #E2EFE9;
      --bg: #0D1614;
      --surface: #14221F;
      --surface-border: #233732;
      --text: #F1F5F3;
      --text-muted: #8FA59D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* TOP BAR */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      font-family: 'Fredoka', cursive;
      font-size: 24px;
      font-weight: 700;
      color: #34D399;
      letter-spacing: -0.5px;
    }
    .brand-tag {
      background: rgba(52, 211, 153, 0.15);
      color: #34D399;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(52, 211, 153, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .brand-sub {
      color: var(--text-muted);
      font-size: 13px;
      margin-left: 8px;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .device-switcher {
      display: flex;
      background: #0B1311;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--surface-border);
    }
    .device-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .device-btn.active {
      background: var(--surface);
      color: #34D399;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* MAIN STAGE */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* SIDEBAR */
    aside {
      width: 290px;
      background: var(--surface);
      border-right: 1px solid var(--surface-border);
      padding: 20px 16px;
      overflow-y: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 6px 12px;
      margin-bottom: 4px;
    }
    .template-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      width: 100%;
    }
    .template-item:hover {
      background: rgba(52, 211, 153, 0.06);
      border-color: rgba(52, 211, 153, 0.15);
    }
    .template-item.active {
      background: rgba(52, 211, 153, 0.12);
      border-color: rgba(52, 211, 153, 0.35);
      color: #34D399;
    }
    .template-item .icon {
      font-size: 18px;
      flex-shrink: 0;
    }
    .template-item .desc {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }

    /* VIEWPORT PREVIEW CANVAS */
    .preview-canvas {
      flex: 1;
      background: #090F0E;
      background-image: radial-gradient(rgba(52, 211, 153, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
    }

    .frame-wrapper {
      background: #FFFFFF;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 16px;
    }
    .frame-wrapper.desktop {
      width: 660px;
      height: 90vh;
      max-height: 860px;
    }
    .frame-wrapper.mobile {
      width: 390px;
      height: 820px;
      border-radius: 44px;
      border: 8px solid #1E2E2A;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.8), 0 0 0 2px #34D399;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #F4F8F6;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-logo">LingoBoop AI</span>
      <span class="brand-tag">Email Design System</span>
      <span class="brand-sub">Supabase Auth Live Preview</span>
    </div>

    <div class="controls">
      <div class="device-switcher">
        <button class="device-btn active" id="btnDesktop" onclick="setDevice('desktop')">
          &#128187; Desktop (660px)
        </button>
        <button class="device-btn" id="btnMobile" onclick="setDevice('mobile')">
          &#128241; Mobile (390px)
        </button>
      </div>
    </div>
  </header>

  <div class="app-body">
    <aside>
      <div class="sidebar-title">Supabase Auth Templates</div>
      
      <button class="template-item active" onclick="loadTemplate('preview_reset_password.html', this)">
        <span class="icon">&#128273;</span>
        <div>
          <span>Password Reset</span>
          <span class="desc">recovery.html &bull; Pano with Golden Key</span>
        </div>
      </button>

      <button class="template-item" onclick="loadTemplate('preview_confirm_signup.html', this)">
        <span class="icon">&#127881;</span>
        <div>
          <span>Confirm Signup / Welcome</span>
          <span class="desc">confirmation.html &bull; Pano Celebrating</span>
        </div>
      </button>

      <button class="template-item" onclick="loadTemplate('preview_magic_link.html', this)">
        <span class="icon">&#10024;</span>
        <div>
          <span>Magic Link</span>
          <span class="desc">magic_link.html &bull; Pano with Magic Glow</span>
        </div>
      </button>

      <button class="template-item" onclick="loadTemplate('preview_email_change.html', this)">
        <span class="icon">&#128236;</span>
        <div>
          <span>Change Email Address</span>
          <span class="desc">email_change.html &bull; Pano with Transfer Envelope</span>
        </div>
      </button>

      <button class="template-item" onclick="loadTemplate('preview_reauthentication.html', this)">
        <span class="icon">&#128737;</span>
        <div>
          <span>Re-authentication (OTP)</span>
          <span class="desc">reauthentication.html &bull; Pano with Emerald Shield</span>
        </div>
      </button>

      <button class="template-item" onclick="loadTemplate('preview_invite_user.html', this)">
        <span class="icon">&#128140;</span>
        <div>
          <span>User Invitation</span>
          <span class="desc">invite.html &bull; Pano with Welcome Paws</span>
        </div>
      </button>

      <div style="margin-top: auto; padding: 14px 10px; background: rgba(52, 211, 153, 0.08); border-radius: 12px; border: 1px solid rgba(52, 211, 153, 0.2);">
        <div style="font-size: 12px; font-weight: 700; color: #34D399; margin-bottom: 4px;">&#10004; Production Ready</div>
        <div style="font-size: 11px; color: var(--text-muted); line-height: 16px;">
          All images hosted on public Supabase CDN. Tested for Gmail, Apple Mail, and Outlook.
        </div>
      </div>
    </aside>

    <main class="preview-canvas">
      <div class="frame-wrapper desktop" id="frameWrapper">
        <iframe id="previewFrame" src="preview_reset_password.html"></iframe>
      </div>
    </main>
  </div>

  <script>
    function setDevice(device) {
      const wrapper = document.getElementById('frameWrapper');
      const btnDesktop = document.getElementById('btnDesktop');
      const btnMobile = document.getElementById('btnMobile');

      if (device === 'mobile') {
        wrapper.className = 'frame-wrapper mobile';
        btnMobile.classList.add('active');
        btnDesktop.classList.remove('active');
      } else {
        wrapper.className = 'frame-wrapper desktop';
        btnDesktop.classList.add('active');
        btnMobile.classList.remove('active');
      }
    }

    function loadTemplate(filename, element) {
      document.getElementById('previewFrame').src = filename;
      document.querySelectorAll('.template-item').forEach(b => b.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
</html>

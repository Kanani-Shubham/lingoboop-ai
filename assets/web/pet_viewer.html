<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; overflow:hidden; -webkit-user-select:none; user-select:none; }
    html, body { width:100%; height:100%; background:transparent; display:flex; align-items:center; justify-content:center; }
    #cv { width:100%; height:100%; display:block; touch-action:none; }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <script src="three.min.js"></script>
  <script src="GLTFLoader.js"></script>
  <script src="models_data.js"></script>
  <script>
    const cv = document.getElementById('cv');
    const R = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: true, powerPreference: 'high-performance' });
    R.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    R.setSize(window.innerWidth, window.innerHeight, false);
    R.outputEncoding = THREE.sRGBEncoding;

    const S = new THREE.Scene();
    const C = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 50);
    C.position.set(0, 1.3, 4.6);
    C.lookAt(0, 0.62, 0);

    S.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.95));
    const D = new THREE.DirectionalLight(0xffffff, 0.8);
    D.position.set(2, 4, 3);
    S.add(D);

    const H = new THREE.Group();
    S.add(H);

    const GL = new THREE.GLTFLoader();
    let mix, acts = {}, curA, model;
    const A = {
      idle: 'idle',
      walk: 'walk',
      dance: 'dance',
      think: 'eat',
      talk: 'gesture-positive',
      listen: 'idle',
      drag: 'run',
      oops: 'gesture-negative',
      cheer: 'dance'
    };
    
    let currentMode = 'idle';
    let face = 0.5;
    let tilt = 0;
    let pulse = 0;
    let isCardOpen = false;
    let dockSide = 'r';

    function play(n) {
      const a = acts[n] || acts.idle;
      if (!a || a === curA) return;
      a.reset().fadeIn(0.25).play();
      if (curA) curA.fadeOut(0.25);
      curA = a;
    }

    function applyMode(m) {
      currentMode = m;
      tilt = (m === 'listen') ? 0.16 : 0;
      if (m === 'talk') pulse = 1.0;
      if (acts && acts[A[m] || 'idle']) {
        play(A[m] || 'idle');
      }
    }

    function loadPet(k) {
      if (!window.PET_MODELS || !window.PET_MODELS[k]) return;
      try {
        const bin = atob(window.PET_MODELS[k]);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        GL.parse(buf.buffer, '', (g) => {
          if (model) H.remove(model);
          model = g.scene;
          model.traverse((o) => { o.frustumCulled = false; });
          
          // Exact prototype bounding box scaling and centering
          const b = new THREE.Box3().setFromObject(model);
          const z = b.getSize(new THREE.Vector3());
          const c = b.getCenter(new THREE.Vector3());
          const s = 1.25 / Math.max(z.x, z.y, z.z);
          model.scale.setScalar(s);
          model.position.set(-c.x * s, -b.min.y * s, -c.z * s);
          
          H.add(model);
          mix = new THREE.AnimationMixer(model);
          acts = {};
          g.animations.forEach((a) => {
            acts[a.name] = mix.clipAction(a);
          });
          curA = null;
          play(A[currentMode] || 'idle');
        }, (err) => {
          console.error('Error parsing GLTF pet model:', err);
        });
      } catch (e) {
        console.error('Error loading pet model:', e);
      }
    }

    window.setPet = function(k) { loadPet(k); };
    window.setMode = function(m) { applyMode(m); };
    window.setFacing = function(dir) { face = dir; };
    window.setCardDock = function(open, side) {
      isCardOpen = !!open;
      dockSide = side || 'r';
    };
    window.triggerPulse = function() { pulse = 1.0; };

    // Initial pet load from URL parameter or default fox
    const urlParams = new URLSearchParams(window.location.search);
    const initialPet = urlParams.get('pet') || 'fox';
    loadPet(initialPet);

    window.addEventListener('resize', () => {
      R.setSize(window.innerWidth, window.innerHeight, false);
      C.aspect = window.innerWidth / window.innerHeight;
      C.updateProjectionMatrix();
    });

    const clk = new THREE.Clock();
    function tick() {
      requestAnimationFrame(tick);
      const dt = Math.min(clk.getDelta(), 0.1);
      if (mix) mix.update(dt);

      if (currentMode !== 'walk') {
        face = isCardOpen ? (dockSide === 'r' ? 0.9 : -0.9) : 0.5;
      }
      H.rotation.y += (face - H.rotation.y) * Math.min(1, dt * 8);
      H.rotation.z += (tilt - H.rotation.z) * Math.min(1, dt * 6);
      pulse *= Math.exp(-dt * 8);
      H.scale.set(1 - 0.05 * pulse, 1 + 0.12 * pulse, 1 - 0.05 * pulse);

      R.render(S, C);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
